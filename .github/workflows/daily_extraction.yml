name: Daily InvestTalk Podcast Summaries Extraction

on:
  schedule:
    # 7:00 PM Pacific Time Monday-Friday (02:00 AM UTC Tuesday-Saturday)
    - cron: '0 2 * * 2-6'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-extraction ignoring cache (--force)'
        required: false
        type: boolean
        default: false
      start_date:
        description: 'Start date YYYY-MM-DD (optional)'
        required: false
        type: string
        default: ''
      end_date:
        description: 'End date YYYY-MM-DD (optional)'
        required: false
        type: string
        default: ''

jobs:
  extract-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run InvestTalk Ticker Extraction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_OPT: ${{ inputs.force && '--force' || '' }}
          START_OPT: ${{ inputs.start_date && format('--start-date {0}', inputs.start_date) || '' }}
          END_OPT: ${{ inputs.end_date && format('--end-date {0}', inputs.end_date) || '' }}
        run: |
          python extract_tickers.py $FORCE_OPT $START_OPT $END_OPT

      - name: Commit and push updated summaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add summary.md summary.html index.html summaries_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Update daily InvestTalk summaries and stock verdicts" && git push)
